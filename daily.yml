name: Daily Macro Snapshot

on:
  schedule:
    - cron: '30 8 * * *'  # 08:30 UTC daily
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector
        run: |
          python macro_daily_collector_v3_keyless.py --registry registry_full_A_v3_keyless.json --out out --start 2026-04-01

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily_wide
          path: |
            out/daily_wide.csv
            out/daily_wide.xlsx
            out/raw/*.csv

      - name: Commit outputs to repo
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add out/daily_wide.csv out/daily_wide.xlsx out/raw || true
          git diff --cached --quiet || (git commit -m "Update daily snapshot" && git push)
